name: Windows build and tests

on:
  push:
    branches:
      - feature/ps5-luaden-companion
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore LuaToolsGui.sln

      - name: Build
        run: dotnet build LuaToolsGui.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test LuaToolsGui.sln --configuration Release --no-build --no-restore

      - name: Validate localization resources
        run: python scripts/check-i18n.py
